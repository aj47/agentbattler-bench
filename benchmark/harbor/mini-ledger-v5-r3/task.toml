schema_version = "1.4"
multi_step_reward_strategy = "final"
artifacts = [{ source = "/app", destination = "candidate" }]

[task]
name = "agentbattler/mini-ledger-v5"
version = "5.2.0"
description = "Fifteen-turn long-horizon deterministic ledger challenge"

[metadata]
benchmark = "AgentBattler"
challenge = "mini-ledger-v5"
protocol_revision = "r3"
harbor_version = "0.20.0"
visible_points = 70
holdout_points = 30
agent_time_policy = "hard-30-minutes-per-turn-with-agent-notice"
verifier_workspace_policy = "source-only-per-stage-and-holdout-case"

[agent]
network_mode = "public"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[verifier.environment]
# Harbor 0.20's Docker provider rejects no-network for separate verifier
# environments. Filesystem isolation is enforced by the separate container;
# the verifier has no credentials and makes no network requests.
network_mode = "public"
workdir = "/"
cpus = 4
memory_mb = 4096
storage_mb = 4096

[environment]
network_mode = "public"
workdir = "/app"
cpus = 4
memory_mb = 4096
storage_mb = 8192

